<div class="header">
  <btj-search-bar class="search-bar" 
    (addTrack)="addTrack($event);" 
    (clearSearch)="clearSearch();" 
    (searchQueryChange)="searchQueryChange($event)" 
    [isLoading]="isLoading()" 
    [query]="searchQuery()" 
    [searchResults]="searchResults()" 
  />
</div>

<div class="roompage">
  <div class="room-page-container">
    @let _currentTrack = currentTrack();

    @if (_currentTrack) {
      <app-media-player class="media-player" 
        (pauseTrack)="pauseTrack()"
        (playTrack)="playTrack()"
        [isPlaying]="isPlaying"
        [progress]="currentTrackProgress()"
        [track]="_currentTrack!"
      />
    }

    <div class="queue">
      @for (track of queueTracks(); track $index) {
        <app-queue-row
          (removeVote)="removeVote()"
          (upvote)="vote()"
          [track]="track"
          [upVoteCount]="upvoteCount"
          [upvoted]="upvoted" 
        />
      }  @empty {
        <p class="empty-queue">search tracks to queue</p>
      }
    </div>
  </div>
</div>

<button type="button" (click)="refreshTokens()" (keydown)="refreshTokens()">test</button>

@if (showSelectDevicesModal()) {
  <btj-select-devices-modal class="devices-modal"
    (setActiveDeviceId)="setSelectedDeviceId($event)"
    [devices]="devices()"
  />
}
