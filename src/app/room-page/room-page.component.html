<div class="header">
  <btj-search-bar class="search-bar" 
    (addTrack)="addTrack($event);" 
    (clearSearch)="clearSearch();" 
    (searchQueryChange)="searchQueryChange($event)" 
    [isLoading]="isLoading()" 
    [query]="searchQuery()" 
    [searchResults]="searchResults()" 
  />
</div>

<div class="roompage">
  <div class="room-page-container">
    <app-media-player class="media-player" 
      (pauseTrack)="pauseTrack()"
      (playTrack)="playTrack()"
      [isPlaying]="isPlaying"
      [progress]="progress"
      [track]="trackData"
    />
    
    <div class="queue">
      @for (item of tracks; track $index) {
      <app-queue-row
        (removeVote)="removeVote()"
        (upvote)="vote()"
        [track]="trackData"
        [upVoteCount]="upvoteCount"
        [upvoted]="upvoted" 
      />
      }  @empty {
        <p>search tracks to queue</p>
      }
    </div>
  </div>
</div>
