<div class="header">
  <div class="logo">
    <span class="short">BTJ</span>
    <span class="long">BETTERJAMS</span>
  </div>

  <btj-search-bar class="search-bar" 
    (addTrack)="addTrack($event);" 
    (clearSearch)="clearSearch();" 
    (searchQueryChange)="searchQueryChange($event)" 
    [isLoading]="isLoading()" 
    [query]="searchQuery()" 
    [searchResults]="searchResults()" 
  />

  @if(userProfile()) {
    <btj-user-profile class="user-profile" 
      [userProfile]="userProfile()!" 
      [userProfileUrl]="userProfile()!" 
    />
  }

</div>

@if (!userIsLoading()) {
  <div class="room-page">
    <div class="room-page-container">
      @let _currentTrack = currentTrack();

      @if (_currentTrack) {
        <app-media-player class="media-player" 
          (pauseTrack)="pauseTrack()"
          (playTrack)="playTrack()"
          [isPlaying]="isPlaying"
          [progress]="currentTrackProgress()"
          [track]="_currentTrack!"
        />
      }

      <div class="queue">
        @for (track of queueTracks(); track track.uuid) {
          <app-queue-row
            (upvote)="upvoteTrack(track)"
            [track]="track"
            [upVoteCount]="upvoteCount" 
            [upvoted]="track.upvoteIds.includes(userProfile()!.userId)"
          />
        }  @empty {
          <p class="empty-queue">search tracks to queue</p>
        }
      </div>
    </div>
  </div>
}
