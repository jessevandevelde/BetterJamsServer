@let _track = track();

<div class="media-player">
  <img class="album-cover" [src]="_track.albumCoverUrl" />
<div class="right">
  <div class="song-info">
    <h3 class="song-name">{{_track.songName}}</h3>
    <p class="artist-name">{{_track.artistName}}</p>
  </div>

  <div class="controls">
    <fa-icon [icon]="pause" class="pause-icon"></fa-icon>
    <div class="bar">
      <div class="progressbar" [style.width.%]="progressPercentage"></div>
    </div>
    </div>
